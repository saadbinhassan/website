<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Order Management - SLAO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slao: { maroon: '#6b182b', maroonDark: '#4a0f1d', gold: '#d4af37', cream: '#fcf8f3', charcoal: '#1c1c1c' }
                    },
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slao-cream text-gray-900 min-h-screen flex flex-col">
    <header class="bg-slao-maroon text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 h-20 flex items-center justify-between">
            <div>
                <span class="font-serif text-2xl sm:text-3xl font-extrabold tracking-widest">SLAO ADMIN</span>
                <span class="block text-[10px] tracking-[0.25em] text-slao-gold uppercase">Order Status Control Panel</span>
            </div>
            <div class="flex items-center gap-4 text-xs font-bold uppercase">
                <a href="track-order.html" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition">Customer Tracking Page</a>
                <a href="index.html" class="px-4 py-2 rounded-xl bg-slao-gold text-slao-charcoal hover:bg-yellow-400 transition">Storefront</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full p-4 sm:p-8 flex-grow space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="font-serif text-2xl font-bold text-slao-maroon">Manage Customer Orders</h1>
                <p class="text-xs text-gray-500 mt-1">Update order status below. Changes automatically reflect on the customer's Track Order page.</p>
            </div>
            <input id="admin-search" type="text" oninput="renderAdminOrders()" placeholder="Search Order ID or Customer Name..." class="w-full sm:w-72 p-3 text-xs border rounded-xl">
        </div>

        <div id="admin-orders-list" class="space-y-4"></div>
    </main>

    <script>
        function updateStatus(orderId, newStatus) {
            const orders = JSON.parse(localStorage.getItem('slao_orders') || '[]');
            const idx = orders.findIndex(o => (o.orderId || o.voucherId) === orderId);
            if (idx !== -1) {
                orders[idx].status = newStatus;
                localStorage.setItem('slao_orders', JSON.stringify(orders));
                renderAdminOrders();
            }
        }

        function renderAdminOrders() {
            const query = (document.getElementById('admin-search').value || '').trim().toLowerCase();
            const orders = JSON.parse(localStorage.getItem('slao_orders') || '[]');
            const container = document.getElementById('admin-orders-list');

            const filtered = orders.filter(o => {
                const id = (o.orderId || o.voucherId || '').toLowerCase();
                const name = (o.name || '').toLowerCase();
                return id.includes(query) || name.includes(query);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow text-center text-sm text-gray-500">
                        No orders found yet. Orders placed at checkout will appear here.
                    </div>
                `;
                return;
            }

            const statuses = ['Packing Pending', 'Dispatch Pending', 'Delivery Complete', 'Return Order'];

            container.innerHTML = filtered.map(o => {
                const oid = o.orderId || o.voucherId;
                const current = o.status || 'Packing Pending';
                const btns = statuses.map(st => {
                    const active = st === current;
                    return `<button type="button" onclick="updateStatus('${oid}', '${st}')" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                        active
                            ? 'bg-slao-maroon text-white border-slao-maroon shadow'
                            : 'bg-gray-50 text-gray-700 border-gray-300 hover:border-slao-maroon'
                    }">${st}</button>`;
                }).join('');

                return `
                    <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-100 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b pb-3 gap-2">
                            <div>
                                <span class="font-mono text-lg font-extrabold text-slao-maroon">${oid}</span>
                                <span class="text-xs text-gray-400 ml-2">${o.date || ''}</span>
                                <p class="text-xs text-gray-700 mt-1"><b>${o.name}</b> &bull; ${o.phone} &bull; ${o.city}, ${o.province}</p>
                                <p class="text-xs text-gray-500">${o.address}</p>
                            </div>
                            <div class="sm:text-right">
                                <p class="text-xs text-gray-500">Total (${o.payType})</p>
                                <p class="text-base font-extrabold text-slao-maroon">Rs. ${o.totalAmount.toLocaleString()}</p>
                                <a href="track-order.html?order=${encodeURIComponent(oid)}" target="_blank" class="inline-block mt-1 text-[11px] font-bold text-slao-maroon hover:underline">
                                    Preview Customer View &rarr;
                                </a>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-xs font-bold uppercase text-gray-500 mr-2">Set Status:</span>
                            ${btns}
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderAdminOrders();
    </script>
</body>
</html>
